version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  nats:
    image: nats:2.10-alpine
    ports:
      - '4222:4222'
      - '8222:8222'  # monitoring
    command: ['--jetstream', '--http_port', '8222']
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: entcore
      POSTGRES_PASSWORD: entcore
      POSTGRES_DB: entcore_audit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U entcore']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/entcore_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'  # browser
      - '7687:7687'  # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7474']
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - '16686:16686'  # UI
      - '14268:14268'  # collector HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  # ── NestJS Services ─────────────────────────────────────────────────────────

  gateway-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-api
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NATS_SERVERS: nats://nats:4222
      MONOLITH_BASE_URL: http://host.docker.internal:8090
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      nats:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NATS_SERVERS: nats://nats:4222
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      nats:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: audit-service
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NATS_SERVERS: nats://nats:4222
      DATABASE_URL: ******postgres:5432/entcore_audit
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  communication-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: communication-service
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      NATS_SERVERS: nats://nats:4222
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      nats:
        condition: service_healthy

  organization-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: organization-service
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      NATS_SERVERS: nats://nats:4222
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: entcore_password
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
